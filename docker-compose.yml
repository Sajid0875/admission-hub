# Admission Hub local stack: Postgres + API + Next.js UI
#
# Usage:
#   docker compose up --build
#   open http://localhost:3000
#   API http://localhost:4000/health
#   Docs http://localhost:4000/api/v1/docs
#
# Full guide: docs/GETTING_STARTED.md
# Production (Railway): docs/DEPLOY.md
#
# QA logins (from prisma seed):
#   admin@whitedavid23.local / ChangeMe!Adm1n2026
#   partner@whitedavid23.com / ChangeMe!Partner2026
#   counselor@whitedavid23.com / ChangeMe!Counselor2026
#   support@whitedavid23.com / ChangeMe!Support2026
#
# Secrets for host deploys live in Railway / local/ (gitignored) — not in this file.
services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: admission_hub
    ports:
      - "5432:5432"
    volumes:
      - admission_hub_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d admission_hub"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 4000
      CLIENT_URL: http://localhost:3000
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/admission_hub?schema=public
      JWT_SECRET: docker-dev-only-change-me-to-a-64-char-random-string!!
      JWT_EXPIRES_IN: 15m
      JWT_REFRESH_EXPIRES_IN: 30d
      LOG_LEVEL: info
      FOLLOWUP_REMINDERS_ENABLED: "true"
      FOLLOWUP_REMINDER_INTERVAL_MS: "60000"
      FOLLOWUP_DUE_SOON_MINUTES: "60"
      WHATSAPP_ENABLED: "false"
      WHATSAPP_PROVIDER: stub
      # WHATSAPP_META_ACCESS_TOKEN / WHATSAPP_META_PHONE_NUMBER_ID for live Meta sends

      RUN_SEED: "true"
    ports:
      - "4000:4000"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "node -e \"fetch('http://127.0.0.1:4000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\"",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: http://localhost:4000/api/v1
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3000
      HOSTNAME: 0.0.0.0
    ports:
      - "3000:3000"

volumes:
  admission_hub_pg:
