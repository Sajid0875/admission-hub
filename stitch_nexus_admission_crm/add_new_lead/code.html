<body class="bg-surface h-full flex flex-col items-center justify-center p-md md:p-xl font-body-md text-on-surface">
<div class="w-full max-w-3xl bg-surface-container-lowest rounded-xl border border-outline-variant shadow-lg flex flex-col max-h-[795px]">
<!-- Top App Bar equivalent for Modal -->
<header class="flex justify-between items-center px-lg py-sm w-full z-40 border-b border-outline-variant bg-surface sticky top-0 rounded-t-xl">
<button class="text-on-surface-variant hover:bg-surface-container-low transition-all p-xs rounded-full focus-within:ring-2 focus-within:ring-primary/20 flex items-center justify-center">
<span class="material-symbols-outlined">close</span>
</button>
<h1 class="font-headline-lg text-headline-lg font-bold text-on-surface flex-1 text-center hidden md:block">Add New Lead</h1>
<h1 class="font-headline-lg-mobile text-headline-lg-mobile font-bold text-on-surface flex-1 text-center md:hidden">Add New Lead</h1>
<div class="w-10"></div> <!-- Spacer for centering -->
</header>
<!-- Main Content Scrollable Area -->
<main class="flex-1 overflow-y-auto p-lg flex flex-col gap-xl">
<!-- Duplicate Warning Card -->
<div class="bg-error-container/20 border border-error/30 rounded-lg p-md flex items-start gap-sm">
<span class="material-symbols-outlined text-error mt-0.5">warning</span>
<div>
<h3 class="font-label-md text-label-md text-on-error-container">Possible Duplicate Lead</h3>
<p class="font-body-sm text-body-sm text-on-surface-variant mt-1">A lead with the phone number +1 555-0199 already exists in the system. <a class="text-primary hover:underline" href="#">View existing lead</a>.</p>
</div>
</div>
<!-- Bento Layout for Forms -->
<div class="grid grid-cols-1 md:grid-cols-2 gap-lg">
<!-- Student Info Section -->
<section class="flex flex-col gap-md">
<div class="flex items-center gap-sm border-b border-outline-variant pb-sm">
<span class="material-symbols-outlined text-primary">person</span>
<h2 class="font-headline-md text-headline-md text-on-surface">Student Info</h2>
</div>
<div class="flex flex-col gap-sm">
<label class="font-label-sm text-label-sm text-on-surface-variant" for="fullName">Full Name</label>
<input class="w-full bg-surface-container-lowest border border-outline-variant rounded-DEFAULT px-md py-sm font-body-md text-on-surface focus:border-primary focus:ring-primary/20 focus:ring-2 transition-all outline-none" id="fullName" placeholder="Jane Doe" type="text"/>
</div>
<div class="grid grid-cols-2 gap-md">
<div class="flex flex-col gap-sm">
<label class="font-label-sm text-label-sm text-on-surface-variant" for="phone">Phone</label>
<input class="w-full bg-surface-container-lowest border border-error rounded-DEFAULT px-md py-sm font-body-md text-on-surface focus:border-error focus:ring-error/20 focus:ring-2 transition-all outline-none" id="phone" type="tel" value="+1 555-0199"/>
</div>
<div class="flex flex-col gap-sm">
<label class="font-label-sm text-label-sm text-on-surface-variant" for="whatsapp">WhatsApp</label>
<input class="w-full bg-surface-container-lowest border border-outline-variant rounded-DEFAULT px-md py-sm font-body-md text-on-surface focus:border-primary focus:ring-primary/20 focus:ring-2 transition-all outline-none" id="whatsapp" placeholder="Same as phone" type="tel"/>
</div>
</div>
<div class="flex flex-col gap-sm">
<label class="font-label-sm text-label-sm text-on-surface-variant" for="email">Email Address</label>
<input class="w-full bg-surface-container-lowest border border-outline-variant rounded-DEFAULT px-md py-sm font-body-md text-on-surface focus:border-primary focus:ring-primary/20 focus:ring-2 transition-all outline-none" id="email" placeholder="jane@example.com" type="email"/>
</div>
<div class="flex flex-col gap-sm">
<label class="font-label-sm text-label-sm text-on-surface-variant" for="city">City/Location</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-sm top-1/2 -translate-y-1/2 text-on-surface-variant">location_on</span>
<input class="w-full bg-surface-container-lowest border border-outline-variant rounded-DEFAULT pl-xl pr-md py-sm font-body-md text-on-surface focus:border-primary focus:ring-primary/20 focus:ring-2 transition-all outline-none" id="city" placeholder="New York, NY" type="text"/>
</div>
</div>
</section>
<!-- Lead Info Section -->
<section class="flex flex-col gap-md">
<div class="flex items-center gap-sm border-b border-outline-variant pb-sm">
<span class="material-symbols-outlined text-primary">analytics</span>
<h2 class="font-headline-md text-headline-md text-on-surface">Lead Info</h2>
</div>
<div class="flex flex-col gap-sm">
<label class="font-label-sm text-label-sm text-on-surface-variant" for="course">Interested Course</label>
<select class="w-full bg-surface-container-lowest border border-outline-variant rounded-DEFAULT px-md py-sm font-body-md text-on-surface focus:border-primary focus:ring-primary/20 focus:ring-2 transition-all outline-none appearance-none" id="course">
<option value="">Select a program</option>
<option value="cs">B.S. Computer Science</option>
<option value="ba">B.A. Business Administration</option>
<option value="ds">M.S. Data Science</option>
</select>
</div>
<div class="grid grid-cols-2 gap-md">
<div class="flex flex-col gap-sm">
<label class="font-label-sm text-label-sm text-on-surface-variant" for="source">Source</label>
<select class="w-full bg-surface-container-lowest border border-outline-variant rounded-DEFAULT px-md py-sm font-body-md text-on-surface focus:border-primary focus:ring-primary/20 focus:ring-2 transition-all outline-none appearance-none" id="source">
<option>Website Organic</option>
<option>Google Ads</option>
<option>Referral</option>
<option>Event</option>
</select>
</div>
<div class="flex flex-col gap-sm">
<label class="font-label-sm text-label-sm text-on-surface-variant" for="priority">Priority</label>
<select class="w-full bg-surface-container-lowest border border-outline-variant rounded-DEFAULT px-md py-sm font-body-md text-on-surface focus:border-primary focus:ring-primary/20 focus:ring-2 transition-all outline-none appearance-none" id="priority">
<option>High (Hot)</option>
<option>Medium (Warm)</option>
<option>Low (Cold)</option>
</select>
</div>
</div>
<div class="flex flex-col gap-sm">
<label class="font-label-sm text-label-sm text-on-surface-variant" for="budget">Budget Range</label>
<input class="w-full bg-surface-container-lowest border border-outline-variant rounded-DEFAULT px-md py-sm font-body-md text-on-surface focus:border-primary focus:ring-primary/20 focus:ring-2 transition-all outline-none" id="budget" placeholder="$10k - $20k" type="text"/>
</div>
<div class="flex flex-col gap-sm">
<label class="font-label-sm text-label-sm text-on-surface-variant" for="counselor">Assigned Counselor</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-sm top-1/2 -translate-y-1/2 text-on-surface-variant">badge</span>
<select class="w-full bg-surface-container-lowest border border-outline-variant rounded-DEFAULT pl-xl pr-md py-sm font-body-md text-on-surface focus:border-primary focus:ring-primary/20 focus:ring-2 transition-all outline-none appearance-none" id="counselor">
<option>Unassigned</option>
<option>Sarah Jenkins</option>
<option>Michael Chang</option>
</select>
</div>
</div>
</section>
</div>
</main>
<!-- Bottom Action Bar -->
<footer class="p-lg border-t border-outline-variant bg-surface rounded-b-xl flex justify-end gap-md">
<button class="px-lg py-sm font-label-md text-label-md text-on-surface bg-surface-container-lowest border border-outline-variant rounded-lg hover:bg-surface-container-low transition-colors">
                Cancel
            </button>
<button class="px-lg py-sm font-label-md text-label-md text-on-primary bg-primary rounded-lg hover:bg-surface-tint transition-colors shadow-sm flex items-center gap-xs">
<span>Create Lead</span>
<span class="material-symbols-outlined text-[18px]">arrow_forward</span>
</button>
</footer>
</div>
