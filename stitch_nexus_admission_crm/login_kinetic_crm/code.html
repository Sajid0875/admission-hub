<body class="h-full flex items-center justify-center bg-surface-container-low text-on-surface antialiased p-md md:p-lg">
<main class="w-full max-w-[420px] bg-surface rounded-xl border border-outline-variant shadow-lg md:shadow-[0px_4px_6px_-1px_rgba(0,0,0,0.1),_0px_2px_4px_-1px_rgba(0,0,0,0.06)] p-lg md:p-xl flex flex-col gap-lg">
<!-- Header -->
<header class="flex flex-col items-center text-center gap-sm">
<div class="flex items-center gap-xs text-primary mb-xs">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1; font-size: 32px;">dynamic_form</span>
<span class="font-headline-lg text-headline-lg font-bold text-on-surface tracking-tight">Kinetic CRM</span>
</div>
<h1 class="font-headline-md text-headline-md text-on-surface">Partner Portal</h1>
<p class="font-body-sm text-body-sm text-on-surface-variant max-w-[280px]">Manage leads, admissions, and partner growth from one place.</p>
</header>
<!-- Form -->
<form action="#" class="flex flex-col gap-md" method="POST">
<div class="flex flex-col gap-xs">
<label class="font-label-sm text-label-sm text-on-surface-variant uppercase" for="email">Email Address</label>
<div class="relative flex items-center">
<span class="material-symbols-outlined absolute left-sm text-outline z-10 pointer-events-none">mail</span>
<input class="w-full bg-surface-container-lowest border border-outline-variant rounded-lg py-sm pl-xl pr-sm font-body-md text-body-md text-on-surface placeholder:text-outline focus:border-primary focus:ring-2 focus:ring-primary/20 transition-all outline-none" id="email" name="email" placeholder="name@company.com" required="" type="email"/>
</div>
</div>
<div class="flex flex-col gap-xs">
<div class="flex justify-between items-center">
<label class="font-label-sm text-label-sm text-on-surface-variant uppercase" for="password">Password</label>
<a class="font-label-sm text-label-sm text-primary hover:text-primary-container transition-colors" href="#">Forgot password?</a>
</div>
<div class="relative flex items-center">
<span class="material-symbols-outlined absolute left-sm text-outline z-10 pointer-events-none">lock</span>
<input class="w-full bg-surface-container-lowest border border-outline-variant rounded-lg py-sm pl-xl pr-sm font-body-md text-body-md text-on-surface placeholder:text-outline focus:border-primary focus:ring-2 focus:ring-primary/20 transition-all outline-none" id="password" name="password" placeholder="••••••••" required="" type="password"/>
</div>
</div>
<div class="flex items-center gap-sm mt-xs">
<input class="w-4 h-4 rounded border-outline-variant text-primary focus:ring-primary/20 bg-surface-container-lowest cursor-pointer" id="remember" name="remember" type="checkbox"/>
<label class="font-body-sm text-body-sm text-on-surface-variant cursor-pointer select-none" for="remember">Remember me for 30 days</label>
</div>
<button class="mt-sm w-full bg-primary hover:bg-primary-container text-on-primary font-label-md text-label-md py-sm rounded-lg shadow-sm transition-all flex items-center justify-center gap-xs active:scale-[0.98]" type="submit">
                Sign In
                <span class="material-symbols-outlined" style="font-size: 18px;">arrow_forward</span>
</button>
</form>
<footer class="text-center mt-xs border-t border-outline-variant pt-md">
<p class="font-body-sm text-body-sm text-on-surface-variant">Don't have a partner account? <a class="text-primary font-medium hover:underline" href="#">Request access</a></p>
</footer>
