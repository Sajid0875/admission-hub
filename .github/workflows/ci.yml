name: CI

on:
  push:
    branches: [main, dev_Sohaim]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Backend typecheck + test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: admission_hub_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      NODE_ENV: test
      PORT: 4001
      CLIENT_URL: http://localhost:3000
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/admission_hub_test?schema=public
      JWT_SECRET: test-only-secret-do-not-use-in-production-please-replace-me-32chars
      JWT_EXPIRES_IN: 1h
      LOG_LEVEL: silent
      FOLLOWUP_REMINDERS_ENABLED: "false"
      FOLLOWUP_REMINDER_INTERVAL_MS: "60000"
      FOLLOWUP_DUE_SOON_MINUTES: "60"
      WHATSAPP_ENABLED: "false"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: ./node_modules/.bin/prisma generate

      - name: Apply migrations to test DB
        run: ./node_modules/.bin/prisma migrate deploy

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

  frontend:
    name: Frontend typecheck
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit
